name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0176D3&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0176d3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00A1E0&color_dots=#161b22,#032d60,#0a5aa8,#0176d3,#00a1e0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
